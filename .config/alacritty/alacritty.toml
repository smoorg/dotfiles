[colors.primary]
background = "#000000"
# foreground = "#ffbf00"

[font]
size = 15

[font.bold]
family = "Berkeley Mono Bold"

[font.italic]
family = "Berkeley Mono Italic"

[font.normal]
family = "Berkeley Mono"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "K"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "NumpadAdd"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "J"
mods = "Control|Shift"

[window]
opacity = 0.9
